services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: battery_monitoring
      POSTGRES_USER: battery
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battery -d battery_monitoring"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
